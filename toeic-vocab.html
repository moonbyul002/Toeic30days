*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:920px;margin:0 auto;padding:20px 16px 48px}
h1,h2{margin:0;line-height:1.25}
.en{font-family:Newsreader,Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.on{background:var(--soft);border-color:var(--accent);font-weight:700}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:1.6rem}
.sub{color:var(--muted);font-size:.92rem}
input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cat{text-align:left;padding:14px;display:flex;flex-direction:column;gap:6px;border-radius:14px}
.cat b{font-size:1.02rem}.cat .d{color:var(--muted);font-size:.85rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.tabs{display:flex;gap:8px;margin:14px 0 18px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 20px;text-align:center;width:100%;cursor:pointer}
.card .w{font-size:clamp(2rem,8vw,3.2rem);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.card .m{font-size:clamp(1.5rem,6vw,2.2rem);font-weight:500}
.hint{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.row.sp{justify-content:space-between;align-items:center}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}.li .e{font-weight:700;font-size:1.1rem}.li.k .e{color:var(--ok)}
.li button{padding:4px 10px}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:12px 14px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.q .w{font-size:1.9rem;font-weight:700;margin:6px 0 6px;overflow-wrap:anywhere}
.big{font-size:3rem;font-weight:700}
@media (max-width:560px){.li{grid-template-columns:1fr auto}.li .z{grid-column:1/3;grid-row:2;color:var(--muted)}}

let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem("vocab-known")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("vocab-known",JSON.stringify([...known]))}catch(e){}};
const S={cur:null,tab:"card",i:0,flip:false,only:false,quiz:null,q:""};
const $=document.getElementById("app");
const key=(c,j)=>c.d+":"+j;
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const pad=n=>String(n).padStart(2,"0");
const cnt=c=>c.w.filter((_,j)=>known.has(key(c,j))).length;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function pool(c){return S.only?c.w.map((_,j)=>j).filter(j=>!known.has(key(c,j))):c.w.map((_,j)=>j)}
function home(){
  const tot=D.reduce((a,c)=>a+c.w.length,0),kn=D.reduce((a,c)=>a+cnt(c),0);
  let h=`<div class="top"><div><h1>職場核心字彙・30 天</h1><div class="sub">共 ${tot} 字，已記得 ${kn} 字（${Math.round(kn/tot*100)}%）</div></div><button data-a="theme">切換深淺色</button></div>
  <input type="search" id="s" placeholder="搜尋英文或中文…" value="${esc(S.q)}" aria-label="搜尋單字">`;
  if(S.q.trim()){
    const q=S.q.trim().toLowerCase();let r=[];
    D.forEach((c,ci)=>c.w.forEach((w,j)=>{if(w[0].toLowerCase().includes(q)||w[1].includes(q))r.push([ci,j,w])}));
    h+=`<div class="sub" style="margin-bottom:8px">找到 ${r.length} 筆</div><div class="list">`+r.slice(0,80).map(([ci,j,w])=>`<div class="li"><span class="e en">${esc(w[0])}</span><span class="z">${esc(w[1])}</span><button data-a="open" data-c="${ci}">Day ${pad(D[ci].d)}</button></div>`).join("")+`</div>`;
  }else{
    h+=`<div class="grid">`+D.map((c,ci)=>{const k=cnt(c);return `<button class="cat" data-a="open" data-c="${ci}"><span class="d">Day ${pad(c.d)}</span><b>${c.t}</b><span class="d">${k} / ${c.w.length} 字</span><span class="bar"><i style="width:${k/c.w.length*100}%"></i></span></button>`}).join("")+`</div>`;
  }
  $.innerHTML=h;
  const s=document.getElementById("s");
  s.oninput=e=>{S.q=e.target.value;const p=s.selectionStart;home();const n=document.getElementById("s");n.focus();n.setSelectionRange(p,p)};
}
function head(c){
  return `<div class="top"><div><button data-a="home">← 全部類別</button></div><div style="text-align:right"><h2>Day ${pad(c.d)}　${c.t}</h2><div class="sub">已記得 ${cnt(c)} / ${c.w.length} 字</div></div></div>
  <div class="tabs">${[["card","單字卡"],["list","單字表"],["quiz","測驗"]].map(([k,n])=>`<button data-a="tab" data-t="${k}" class="${S.tab===k?"on":""}">${n}</button>`).join("")}</div>`;
}
function cardView(c){
  const p=pool(c);
  if(!p.length)return `<div class="q" style="text-align:center"><div class="big">🎉</div><p>這個類別的字都記得了！</p><button data-a="all">重新複習全部</button></div>`;
  if(S.i>=p.length)S.i=0;
  const j=p[S.i],w=c.w[j],k=known.has(key(c,j));
  return `<div class="row sp" style="margin:0 0 10px"><span class="sub">${S.i+1} / ${p.length}${k?"　✓ 已記得":""}</span><button data-a="only" class="${S.only?"on":""}">只看不熟的</button></div>
  <button class="card" data-a="flip" aria-label="翻面">${S.flip?`<div class="m">${esc(w[1])}</div><div class="hint en">${esc(w[0])}</div>`:`<div class="w en">${esc(w[0])}</div><div class="hint">點一下看中文</div>`}</button>
  <div class="row"><button data-a="prev">← 上一個</button><button data-a="next">下一個 →</button></div>
  <div class="row"><button data-a="mark" data-j="${j}" class="pri">${k?"取消記得":"記得了"}</button><button data-a="shuffle">打亂順序</button></div>
  <div class="hint" style="text-align:center;margin-top:10px">鍵盤：空白鍵翻面，← → 切換</div>`;
}
function listView(c){
  return `<div class="row sp" style="margin:0 0 10px"><span class="sub">點「記得」標記已熟的字</span><button data-a="clear">清除此類別進度</button></div><div class="list">`+c.w.map((w,j)=>{const k=known.has(key(c,j));return `<div class="li ${k?"k":""}"><span class="e en">${esc(w[0])}</span><span class="z">${esc(w[1])}</span><button data-a="mark" data-j="${j}" class="${k?"on":""}">${k?"✓ 記得":"記得"}</button></div>`}).join("")+`</div>`;
}
function startQuiz(c){
  const all=D.flatMap(x=>x.w);
  const idx=shuf(c.w.map((_,j)=>j)).slice(0,10);
  S.quiz={n:0,score:0,pick:null,wrong:[],done:false,qs:idx.map(j=>{
    const w=c.w[j],rev=Math.random()<.5,f=rev?1:0,a=rev?0:1;
    let o=new Set([w[a]]);const same=shuf(c.w);
    for(const x of same.concat(shuf(all))){if(o.size>=4)break;if(x[a]!==w[a]&&x[f]!==w[f])o.add(x[a])}
    return {j,w,rev,opts:shuf([...o]),ans:w[a]}})};
}
function quizView(c){
  const z=S.quiz;if(!z){return `<div class="q" style="text-align:center"><p>從這個類別隨機抽 10 題，英文選中文或中文選英文。</p><button class="pri" data-a="qstart">開始測驗</button></div>`}
  if(z.done){return `<div class="q" style="text-align:center"><div class="big">${z.score} / ${z.qs.length}</div><p>答錯的字已標為「不熟」${z.wrong.length?"：":"，全部答對！"}</p><p class="en" style="font-size:1.1rem">${z.wrong.map(w=>esc(w[0])+" "+esc(w[1])).join("<br>")}</p><div class="row"><button class="pri" data-a="qstart">再測一次</button><button data-a="tab" data-t="card">回單字卡</button></div></div>`}
  const q=z.qs[z.n];
  return `<div class="q"><div class="sub">第 ${z.n+1} / ${z.qs.length} 題　答對 ${z.score}</div><div class="w ${q.rev?"":"en"}">${esc(q.rev?q.w[1]:q.w[0])}</div><div class="sub">${q.rev?"選出對應的英文":"選出正確的中文"}</div>`+q.opts.map((o,k)=>{let cl="";if(z.pick!==null){if(o===q.ans)cl="ok";else if(k===z.pick)cl="bad"}return `<button class="opt ${cl} ${q.rev?"en":""}" data-a="pick" data-k="${k}" ${z.pick!==null?"disabled":""}>${esc(o)}</button>`}).join("")+(z.pick!==null?`<div class="row"><button class="pri" data-a="qnext">${z.n+1<z.qs.length?"下一題":"看結果"}</button></div>`:"")+`</div>`;
}
function course(){
  const c=D[S.cur];
  $.innerHTML=head(c)+(S.tab==="card"?cardView(c):S.tab==="list"?listView(c):quizView(c));
}
function render(){S.cur===null?home():course()}
function openDay(ci){S.cur=ci;S.tab="card";S.i=0;S.flip=false;S.quiz=null;S.only=false;try{location.hash="day-"+pad(D[ci].d)}catch(e){}window.scrollTo(0,0);render()}
function goHome(){S.cur=null;try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}render()}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,c=S.cur!==null?D[S.cur]:null;
  if(a==="open")return openDay(+b.dataset.c);
  if(a==="home")return goHome();
  if(a==="theme"){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0f1626";r.dataset.theme=d?"light":"dark";return}
  if(!c)return;
  if(a==="tab"){S.tab=b.dataset.t;S.flip=false;if(S.tab!=="quiz")S.quiz=null}
  else if(a==="flip"){S.flip=!S.flip;if(S.flip===false)null}
  else if(a==="next"){S.i++;S.flip=false}
  else if(a==="prev"){S.i=Math.max(0,S.i-1);S.flip=false}
  else if(a==="mark"){const k=key(c,+b.dataset.j);known.has(k)?known.delete(k):known.add(k);save();if(S.tab==="card"&&S.only){S.flip=false}else if(S.tab==="card"){S.i++;S.flip=false}}
  else if(a==="only"){S.only=!S.only;S.i=0;S.flip=false}
  else if(a==="all"){S.only=false;S.i=0}
  else if(a==="shuffle"){c.w=shuf(c.w.map((w,j)=>[w,known.has(key(c,j))])).map(x=>x[0]);const kk=[...known].filter(x=>!x.startsWith(c.d+":"));known=new Set(kk);S.i=0;S.flip=false;alert("已打亂；為了保持進度正確，此類別的「記得」標記已重設。")}
  else if(a==="clear"){if(confirm("清除這個類別的記得進度？")){[...known].forEach(x=>{if(x.startsWith(c.d+":"))known.delete(x)});save()}}
  else if(a==="qstart"){startQuiz(c)}
  else if(a==="pick"){const z=S.quiz;if(z.pick!==null)return;const q=z.qs[z.n];z.pick=+b.dataset.k;if(q.opts[z.pick]===q.ans)z.score++;else{z.wrong.push(q.w);known.delete(key(c,q.j));save()}}
  else if(a==="qnext"){const z=S.quiz;z.n++;z.pick=null;if(z.n>=z.qs.length)z.done=true}
  render();
});
document.addEventListener("keydown",e=>{
  if(S.cur===null||S.tab!=="card"||e.target.tagName==="INPUT")return;
  if(e.key===" "){e.preventDefault();S.flip=!S.flip;render()}
  else if(e.key==="ArrowRight"){S.i++;S.flip=false;render()}
  else if(e.key==="ArrowLeft"){S.i=Math.max(0,S.i-1);S.flip=false;render()}
});
function fromHash(){const m=/^#day-(\d\d)$/.exec(location.hash);const ci=m?D.findIndex(c=>c.d===+m[1]):-1;if(ci>=0)openDay(ci);else{S.cur=null;render()}}
addEventListener("hashchange",()=>{if(S.cur===null||location.hash!=="#day-"+pad(D[S.cur].d))fromHash()});
fromHash();
</script></body></html>
